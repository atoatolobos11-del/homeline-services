# =============================================================================
# Homeline — Render Blueprint
#
# Single-service deployment: one Node process serves BOTH the REST API and the
# built React storefront, so everything lives on one origin and one URL.
#
#   https://homeline.onrender.com/          → React app (SPA)
#   https://homeline.onrender.com/api/...   → JSON API
#
# Why one service: the client calls the API with a relative "/api" path, so
# there is no VITE_API_URL to configure, no cross-origin request, and no way for
# the storefront to load against a dead API host.
#
# Usage: dashboard.render.com -> New -> Blueprint -> select this repo
#        Render prompts for the two Supabase values marked `sync: false`.
#
# Docs: https://render.com/docs/blueprint-spec
# =============================================================================

services:
  - type: web
    name: homeline
    runtime: node
    plan: free
    # Repo root (not server/) because the build needs client/ as well.
    rootDir: .
    # There is no root package.json — each half installs its own dependencies.
    buildCommand: cd server && npm install && cd ../client && npm install && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    # The API and the client ship together, so a build needs both trees.
    buildFilter:
      paths:
        - client/**
        - server/**
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      # Server binds to process.env.PORT, which Render injects automatically.
      # Do NOT hardcode PORT here — Render assigns it.
      #
      # VITE_API_URL is deliberately NOT set: client/src/context/DataContext.jsx
      # falls back to the relative path "/api", which is correct on a single
      # origin. Setting it would only re-introduce the chance of a bad host.
      - key: SUPABASE_URL
        sync: false # https://<project-ref>.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false # publishable / anon key — safe to expose, RLS does the work
