# =============================================================================
# Homeline — Render Blueprint (API-only service)
#
# Creates the API service that the Vercel storefront talks to:
#
#   https://homeline-api.onrender.com/api/...   → JSON API (Express + Supabase)
#
# The storefront is deployed separately on Vercel with
# VITE_API_URL = https://homeline-api.onrender.com/api
#
# Usage (fastest way): dashboard.render.com -> New -> Blueprint
#   -> connect/select this repo (atoatolobos11-del/homeline-services)
#   -> Render prompts for the two Supabase values marked `sync: false`
#   -> Apply
#
# Docs: https://render.com/docs/blueprint-spec
# =============================================================================

services:
  - type: web
    name: homeline-api
    runtime: node
    plan: free
    region: singapore            # closest to PH customers and the Supabase pooler
    rootDir: server              # the Express API lives in /server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - server/**
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT automatically — do not hardcode it.
      - key: SUPABASE_URL
        sync: false              # https://uvlthouojygwthqdnlpx.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false              # publishable / anon key — safe to expose, RLS does the work