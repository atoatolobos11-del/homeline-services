# =============================================================================
# Homeline — Render Blueprint (FULL SITE: API + storefront on one origin)
#
# One service serves everything:
#   https://homeline-api.onrender.com/        → React storefront (SPA)
#   https://homeline-api.onrender.com/api/... → JSON API
#
# Usage: dashboard.render.com -> New -> Blueprint -> select this repo
#        Render prompts for the two Supabase values marked `sync: false`.
#
# Docs: https://render.com/docs/blueprint-spec
# =============================================================================

services:
  - type: web
    name: homeline-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: cd server && npm install && cd ../client && npm install --include=dev && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - client/**
        - server/**
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false              # https://uvlthouojygwthqdnlpx.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false              # publishable / anon key — safe to expose, RLS does the work
      - key: ADMIN_EMAIL
        sync: false              # admin2026@gmail.com — must match the admin Supabase account
      - key: ADMIN_PASSWORD
        sync: false              # dashboard sign-in password (Inventory → Admin sign-in)
      - key: ADMIN_SESSION_SECRET
        sync: false              # long random string; generate: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: ADMIN_API_KEY
        sync: false              # optional, server-to-server only — leave blank to disable